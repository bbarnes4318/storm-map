version: '3.8'

services:
  storm-postgres:
    container_name: storm-map-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-stormmap}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-uyneoCird48L5lSvpVhfFK3j17EzIQmT}
      - POSTGRES_DB=${POSTGRES_DB:-storm_map}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stormmap} -d ${POSTGRES_DB:-storm_map}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    container_name: storm-map-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      storm-postgres:
        condition: service_healthy
    environment:
      # Enrichment — safe committed defaults (all OFF). Real values in server-side .env
      - ENRICHMENT_FEATURE_ENABLED=${ENRICHMENT_FEATURE_ENABLED:-false}
      - ENRICHMENT_MOCK_MODE=${ENRICHMENT_MOCK_MODE:-false}
      - ENRICHMENT_ALLOW_MOCK_IN_PRODUCTION=${ENRICHMENT_ALLOW_MOCK_IN_PRODUCTION:-false}
      - ENRICHMENT_ADMIN_TEST_TOKEN=${ENRICHMENT_ADMIN_TEST_TOKEN}
      # Melissa — no default key, safe OFF
      - MELISSA_ENABLED=${MELISSA_ENABLED:-false}
      - MELISSA_LICENSE_KEY=${MELISSA_LICENSE_KEY}
      - MELISSA_TIMEOUT_MS=${MELISSA_TIMEOUT_MS:-8000}
      # OSM/Overpass radius address collection
      - RADIUS_ADDRESS_PROVIDER=${RADIUS_ADDRESS_PROVIDER:-osm_overpass}
      - OSM_OVERPASS_ENDPOINT=${OSM_OVERPASS_ENDPOINT:-https://overpass-api.de/api/interpreter}
      - OSM_OVERPASS_TIMEOUT_MS=${OSM_OVERPASS_TIMEOUT_MS:-25000}
      - RADIUS_ADDRESS_MAX_RESULTS=${RADIUS_ADDRESS_MAX_RESULTS:-1000}
      - RADIUS_ADDRESS_MAX_MILES=${RADIUS_ADDRESS_MAX_MILES:-10}
      # Encryption
      - ENRICHMENT_ENCRYPTION_KEY=${ENRICHMENT_ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-stormmap}:${POSTGRES_PASSWORD:-uyneoCird48L5lSvpVhfFK3j17EzIQmT}@storm-postgres:5432/${POSTGRES_DB:-storm_map}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/storm-map/sign-in}
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/storm-map/sign-up}
      - NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/storm-map}
      - NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/storm-map}
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL:-/storm-map}
      - NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL:-/storm-map}
      - ENRICHMENT_ADMIN_EMAILS=${ENRICHMENT_ADMIN_EMAILS:-}
      - ENRICHMENT_ADMIN_CLERK_USER_IDS=${ENRICHMENT_ADMIN_CLERK_USER_IDS:-}
      - ENRICHMENT_ADMIN_ENABLED=${ENRICHMENT_ADMIN_ENABLED:-true}
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      
      # Secure Router (HTTPS) - intercepts storm-map path
      - "traefik.http.routers.stormmap-secure.rule=(Host(`maps.leadsbystorm.com`) || Host(`storm.aurumshield.vip`) || Host(`stormmap.aurumshield.vip`) || Host(`app.aurumshield.vip`) || Host(`aurumshield.vip`)) && PathPrefix(`/storm-map`)"
      - "traefik.http.routers.stormmap-secure.entrypoints=https"
      - "traefik.http.routers.stormmap-secure.tls=true"
      - "traefik.http.routers.stormmap-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stormmap-secure.service=stormmap-service"
      
      # Insecure Router (HTTP) - intercepts storm-map path for IP testing
      - "traefik.http.routers.stormmap-insecure.rule=(Host(`maps.leadsbystorm.com`) || Host(`87.99.155.241`) || Host(`storm.aurumshield.vip`) || Host(`stormmap.aurumshield.vip`) || Host(`app.aurumshield.vip`) || Host(`aurumshield.vip`)) && PathPrefix(`/storm-map`)"
      - "traefik.http.routers.stormmap-insecure.entrypoints=http"
      - "traefik.http.routers.stormmap-insecure.service=stormmap-service"
      
      # Target Port
      - "traefik.http.services.stormmap-service.loadbalancer.server.port=3000"
      
      # Root Router for redirecting / to /storm-map
      - "traefik.http.routers.stormmap-root.rule=(Host(`maps.leadsbystorm.com`) || Host(`87.99.155.241`) || Host(`storm.aurumshield.vip`) || Host(`stormmap.aurumshield.vip`) || Host(`app.aurumshield.vip`) || Host(`aurumshield.vip`)) && Path(`/`)"
      - "traefik.http.routers.stormmap-root.entrypoints=http"
      - "traefik.http.routers.stormmap-root.middlewares=stormmap-redirect@file"
      - "traefik.http.routers.stormmap-root.service=stormmap-service"

volumes:
  pgdata:
    driver: local

networks:
  coolify:
    name: coolify
    external: true
