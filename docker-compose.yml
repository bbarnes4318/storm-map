version: '3.8'

services:
  app:
    container_name: storm-map-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      
      # Secure Router (HTTPS) - intercepts storm-map path
      - "traefik.http.routers.stormmap-secure.rule=(Host(`storm.aurumshield.vip`) || Host(`stormmap.aurumshield.vip`) || Host(`app.aurumshield.vip`) || Host(`aurumshield.vip`)) && PathPrefix(`/storm-map`)"
      - "traefik.http.routers.stormmap-secure.entrypoints=https"
      - "traefik.http.routers.stormmap-secure.tls=true"
      - "traefik.http.routers.stormmap-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stormmap-secure.service=stormmap-service"
      
      # Insecure Router (HTTP) - intercepts storm-map path for IP testing
      - "traefik.http.routers.stormmap-insecure.rule=(Host(`178.156.213.79`) || Host(`storm.aurumshield.vip`) || Host(`stormmap.aurumshield.vip`) || Host(`app.aurumshield.vip`) || Host(`aurumshield.vip`)) && PathPrefix(`/storm-map`)"
      - "traefik.http.routers.stormmap-insecure.entrypoints=http"
      - "traefik.http.routers.stormmap-insecure.service=stormmap-service"
      
      # Target Port
      - "traefik.http.services.stormmap-service.loadbalancer.server.port=3000"

networks:
  coolify:
    name: coolify
    external: true
